- name: clean the code
  ansible.builtin.file:
    path: "{{ app_loc }}"
    state: absent

- name: Make a directory
  ansible.builtin.file:
    path: "{{ app_loc }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"

- name: Download artifactory
  ansible.builtin.get_url:
    url: http://admin:Artifact123@13.222.138.152:8081/artifactory/expense-frontend/v4.zip
    dest: /tmp
    owner: "{{ app_user }}"
    group: "{{ app_user }}"

- name: Unarchive artifactory
  ansible.builtin.unarchive:
    src: /tmp/v4.zip
    dest: "{{ app_loc }}"
    remote_src: yes
    owner: "{{ app_user }}"
    group: "{{ app_user }}"



