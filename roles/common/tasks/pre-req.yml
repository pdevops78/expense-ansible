- name: clean the code
  ansible.builtin.file:
    path: "{{ app_loc }}"
    state: absent
    owner: "{{ app_user }}"
    group: "{{ app_user }}"

- name: Make a directory
  ansible.builtin.file:
    path: "{{ app_loc }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"


