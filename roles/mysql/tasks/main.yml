- name: Install mysql server package
  ansible.builtin.dnf:
    name: mysql-server
    state: latest

- name: Install Python 3
  ansible.builtin.dnf:
    name: python3
    state: installed

- name: Install Python MySQL Client
  ansible.builtin.pip:
    name:
      - PyMySQL
      - cryptography
    executable: pip3

